name: astrbot_plugin_av_sense
logo: ./logo.png
display_name: 语音视频感知
short_desc: 她听得懂你发的语音、看得懂你发的视频，也认得出你发的表情包/梗图（本地识别，不花钱）
desc: >-
  【需要的前置】
  AstrBot ≥ 4.17（aiocqhttp 协议端）；系统里装了 ffmpeg 和 ffprobe 并加进 PATH。
  语音识别默认走本机（faster-whisper / funasr，插件会自动找、自动起，不花钱）；
  本机什么都没有时会退到 AstrBot 自带的「语音转文字」，所以不配也能用。

  【功能】
  1. 语音消息：转成文字再交给模型，她按你说的回答；听不清会直说没听清。
  2. 视频消息：只看前 3 分钟，抽关键帧当图片给模型看，同时把里面的声音转成文字。
  3. 表情与表情包：认得出你发的是表情包/梗图/动图还是普通照片，
     把 QQ 小黄脸和商城表情翻译成文字，并提示模型按社交方式接梗（可配 4 种风格）；
     纯表情/纯表情包消息会自动补一句文字，避免她不回话。
  4. 临时文件（图片、音频）保留 7 天后自动删除，可改。
  5. 全部离线可用，不调用其它插件。
  6. 视频分析可只限主人（video_owner_uids）：别人发的视频直接跳过，不抽帧、不烧 token。
  7. 不写死任何本机路径；自动找 GPT-SoVITS 的范围由 asr_search_roots 限定，不扫整盘。

  【怎么用】
  装好插件后，把这句话发给你的 AI：

  「请帮我配置好 AstrBot 里的【语音视频感知】插件，并验证是否可用。」

  AI 会检查 ffmpeg、语音识别、模型能不能看图，然后发一条语音和一条视频做验证，
  最后告诉你哪些能力通了。
version: 0.5.1
author: paopao
repo: https://github.com/zuoyu123654/astrbot_plugin_av_sense
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
tags:
  - 语音识别
  - 视频
  - 识图
  - 表情包
  - 表情识别
  - 离线
